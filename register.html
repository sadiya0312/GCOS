<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become a member | Global Community of Support</title><meta name="description" content="Become a member">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,400&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-root="" data-page="member"><div id="hdr"></div>
<main id="main"><div class="formpage"><div class="formbox"><h1 style="font-size:1.8rem" data-t="register">Become a member</h1>
<form id="f" novalidate>
<label for="nm" data-t="name">Full name</label><input id="nm" autocomplete="name" required>
<div class="cols2"><div><label for="og" data-t="org">Organization</label><input id="og" autocomplete="organization"></div>
<div><label for="co" data-t="country">Country</label><input id="co" autocomplete="country-name"></div></div>
<label for="ro" data-t="role">Role</label><input id="ro" autocomplete="organization-title">
<label for="em" data-t="email">Email</label><input id="em" type="email" autocomplete="email" required>
<label for="pw" data-t="password">Password</label><input id="pw" type="password" autocomplete="new-password" required>
<label for="pc" data-t="confirm">Confirm password</label><input id="pc" type="password" autocomplete="new-password" required>
<label for="cm" data-t="comments">Question/Comments</label><textarea id="cm" rows="4"></textarea>
<div id="m" class="msg" role="alert"></div><button class="btn solid" type="submit" data-t="submit_reg">Create my membership</button></form>
<p class="note"><span data-t="have_acct">Already a member?</span> <a href="login.html" data-t="login">Login</a></p></div></div><script>const msgBox=(k,ok)=>{const m=document.getElementById('m');m.className='msg '+(ok?'ok':'err');m.textContent=t(k)};
const busy=(on)=>{const b=document.querySelector('#f button[type=submit]');if(b)b.disabled=on};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
if(!nm.value.trim()||!em.value||!em.validity.valid)return msgBox('err_login');
if(pw.value.length<8)return msgBox('err_short');if(pw.value!==pc.value)return msgBox('err_match');
busy(true);const r=await Auth.register({name:nm.value.trim(),org:og.value.trim(),country:co.value.trim(),role:ro.value.trim(),email:em.value.trim(),password:pw.value,comments:cm.value.trim()});busy(false);
if(r.ok)location.href='index.html';else msgBox(Auth.errKey(r,'err_server'))};</script></main><div id="ftr"></div>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script><script src="js/site.js"></script>
</body></html>
