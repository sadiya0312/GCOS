<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Global Community of Support</title><meta name="description" content="Reset password">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,400&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-root="" data-page="member"><div id="hdr"></div>
<main id="main"><div class="formpage"><div class="formbox"><h1 style="font-size:1.8rem" data-t="reset_h">Reset password</h1>
<form id="f" novalidate><label for="em" data-t="email">Email</label><input id="em" type="email" autocomplete="email" required>
<button class="btn solid" type="button" id="send" data-t="send_code">Send me a code</button>
<div class="step2" hidden>
<div id="cdbox"><label for="cd" data-t="code">Code from your email</label><input id="cd" inputmode="numeric" autocomplete="one-time-code"></div>
<label for="pw" data-t="newpw">New password</label><input id="pw" type="password" autocomplete="new-password">
<label for="pc" data-t="confirm">Confirm password</label><input id="pc" type="password" autocomplete="new-password">
<button class="btn solid" type="submit" data-t="reset_h">Reset password</button></div>
<div id="m" class="msg" role="alert"></div></form>
<p class="note"><a href="login.html" data-t="back_login">Back to login</a></p></div></div><script>const msgBox=(k,ok)=>{const m=document.getElementById('m');m.className='msg '+(ok?'ok':'err');m.textContent=t(k)};
const busy=(on)=>{const b=document.querySelector('#f button[type=submit]');if(b)b.disabled=on};
const step2=document.querySelector('.step2'),send=document.getElementById('send');
if(Auth.server){send.hidden=false}else{send.hidden=true;document.getElementById('cdbox').hidden=true;step2.hidden=false}
send.onclick=async()=>{if(!em.value||!em.validity.valid)return msgBox('err_login');send.disabled=true;
const r=await Auth.forgot(em.value.trim());send.disabled=false;
if(r.ok===false)return msgBox(Auth.errKey(r,'err_server'));step2.hidden=false;msgBox('code_sent',true)};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
if(!em.value||!em.validity.valid)return msgBox('err_login');if(pw.value.length<8)return msgBox('err_short');if(pw.value!==pc.value)return msgBox('err_match');
busy(true);const r=await Auth.reset(em.value.trim(),pw.value,cd.value.trim());busy(false);
if(!r.ok)return msgBox(r.err==='noacct'?'err_noacct':Auth.errKey(r,'err_code'));
msgBox('ok_reset',true);setTimeout(()=>location.href='login.html',1500)};</script></main><div id="ftr"></div>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script><script src="js/site.js"></script>
</body></html>
