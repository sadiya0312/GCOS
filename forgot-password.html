<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Global Community of Support</title><meta name="description" content="Reset password">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,400&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-root="" data-page="member"><div id="hdr"></div>
<main id="main"><div class="formpage"><div class="formbox"><h1 style="font-size:1.8rem" data-t="reset_h">Reset password</h1>
<form id="f" novalidate><label for="em" data-t="email">Email</label><input id="em" type="email" autocomplete="email" required>
<label for="pw" data-t="newpw">New password</label><input id="pw" type="password" autocomplete="new-password" required>
<label for="pc" data-t="confirm">Confirm password</label><input id="pc" type="password" autocomplete="new-password" required>
<div id="m" class="msg" role="alert"></div><button class="btn solid" type="submit" data-t="reset_h">Reset password</button></form>
<p class="note"><a href="login.html" data-t="back_login">Back to login</a></p></div></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('m');
const bad=k=>{m.className='msg err';m.textContent=t(k)};
if(!em.value||!em.validity.valid)return bad('err_login');if(pw.value.length<8)return bad('err_short');if(pw.value!==pc.value)return bad('err_match');
const r=await Auth.reset(em.value.trim(),pw.value);if(!r.ok)return bad('err_noacct');
m.className='msg err';m.style.borderColor='#14532d';m.style.color='#14532d';m.style.background='#dcfce7';m.textContent=t('ok_reset');setTimeout(()=>location.href='login.html',1500)};</script></main><div id="ftr"></div>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script><script src="js/site.js"></script>
</body></html>
